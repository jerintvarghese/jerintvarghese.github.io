<body>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    color-scheme: light;
    --ink:#111111; --ink-2:#3a3a3a; --muted:#6e6e6e; --faint:#b9b9b9;
    --paper:#ffffff; --well:#f4f4f4; --card:#f6f6f6; --btn:#474747; --btn-hi:#2b2b2b;
    --grid:#d6d6d6; --green:#30b94d; --red:#ef4b4b; --stage:#111111;
    /* SF Pro on Apple devices (as in the design); Inter, its closest free match, everywhere else */
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  [hidden]{display:none!important}
  html,body{height:100%}
  body{background:var(--stage);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .app{position:relative;max-width:430px;min-height:100%;margin:0 auto;background:var(--paper);box-sizing:border-box;padding:14px 20px 28px;display:flex;flex-direction:column;gap:18px;overflow:hidden}
  @media (min-width:520px){ .app{min-height:auto;margin:24px auto;border-radius:44px;box-shadow:0 0 0 10px #1c1c1c,0 0 0 12px #3a3a3a,0 40px 120px rgba(255,255,255,.06)} body{padding-block:8px} }

  header{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;min-height:52px}
  header h1{grid-column:1;margin:0;font-size:19px;font-weight:680;letter-spacing:-.02em}
  header .mark{grid-column:2;width:40px;height:40px;align-self:start}
  header .mark path{fill:var(--ink)}

  .well{background:var(--well);border-radius:16px;padding:8px}
  .presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 9px}
  .tile{position:relative;aspect-ratio:3/2;max-width:100%;border:0;padding:0;border-radius:9px;overflow:hidden;cursor:pointer;background:#555 center/cover no-repeat;font:inherit;color:#fff;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.18);transition:transform .15s ease}
  .tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 55%)}
  .tile span{position:absolute;left:9px;top:7px;font-weight:650;font-size:14px;letter-spacing:-.005em;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .tile:active{transform:scale(.97)}
  .tile[aria-pressed="true"]{outline:2px solid #fff;outline-offset:-4px;box-shadow:0 0 0 2px var(--btn-hi),0 2px 8px rgba(0,0,0,.25)}
  .tile:focus-visible,.slot:focus-visible,.pill:focus-visible,.exit:focus-visible,.play:focus-visible,.choose:focus-visible{outline:3px solid #7aa7ff;outline-offset:2px}

  h2{margin:0;text-align:center;font-size:18px;font-weight:680;letter-spacing:-.015em}
  .custom{display:flex;flex-direction:column;gap:10px}
  .slots{display:flex;justify-content:center;gap:10px;padding:20px 12px;margin:0 16px}
  .slot{flex:0 1 92px;height:58px;border:0;border-radius:8px;background:var(--btn);color:#fff;font:650 15px var(--font);letter-spacing:-.01em;cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2);position:relative;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  .slot.empty{background:#8a8a8a}
  .slot[aria-pressed="true"]{background:var(--btn-hi);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--btn-hi)}
  .slot .fill{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff;border-radius:0 0 8px 8px;opacity:.9}
  .hint{margin:0;text-align:center;font-size:11.5px;color:var(--muted)}

  .eq{position:relative}
  .eq canvas{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  .eq svg{position:relative;display:block;width:100%;height:auto;touch-action:none;cursor:ns-resize;overflow:visible}
  .eq .axis{font:10px var(--font);fill:var(--ink-2)}
  .eq .hz{font:10px var(--font);fill:var(--ink-2);text-anchor:middle}
  .eq .knob{fill:var(--ink);stroke:#fff;stroke-width:0;transition:r .12s}
  .eq .band:focus{outline:none}
  .eq .band:focus .knob,.eq .band.active .knob{r:8.5}
  .eq .tip{font:600 11px var(--font);fill:#fff;text-anchor:middle}
  .eq-foot{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .readout{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pill{border:1.2px solid var(--ink);background:transparent;border-radius:999px;padding:4px 12px;font:500 13px var(--font);color:var(--ink);cursor:pointer}

  .card{background:var(--card);border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:14px}
  .player .play{flex:none;width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer}
  .player .play svg{width:18px;height:18px;fill:#fff}
  .player .meta{flex:1;min-width:0}
  .player .title{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .player .sub{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
  .bar{height:3px;background:#dcdcdc;border-radius:2px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--ink)}
  .choose{flex:none;border:1.2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font:500 12.5px var(--font);cursor:pointer;color:var(--ink)}
  .choose input{display:none}

  .imm .text{flex:1}
  .imm .t{font-size:16px;color:#222}
  .imm .d{font-size:11px;font-weight:300;color:#555;line-height:1.3;margin-top:2px;max-width:220px}
  .switch{position:relative;flex:none;width:54px;height:32px}
  .switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
  .switch .track{position:absolute;inset:0;border-radius:999px;background:#d4d4d4;transition:background .2s}
  .switch .thumb{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
  .switch input:checked + .track{background:var(--green)}
  .switch input:checked + .track + .thumb{transform:translateX(22px)}
  .switch input:focus-visible + .track{outline:3px solid #7aa7ff;outline-offset:2px}

  .exit{border:0;width:100%;background:var(--card);border-radius:12px;padding:18px;color:var(--red);font:400 20px var(--font);cursor:pointer}

  .credit{margin:-4px 0 0;text-align:center;font-size:11.5px;color:var(--muted)}
  .credit a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--faint)}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:5}
  .toast.show{opacity:1;transform:translate(-50%,0)}

  /* splash + exit screens */
  .screen{position:absolute;inset:0;display:grid;place-items:center;z-index:10;transition:opacity .5s ease}
  .splash{background:#fff}
  .splash svg{width:104px;height:104px}
  .splash.gone{opacity:0;pointer-events:none}
  .end{background:#181818;color:#fff;text-align:center}
  .end .inner{display:flex;flex-direction:column;align-items:center;gap:34px}
  .end p{margin:0;font-weight:200;font-size:34px;line-height:1.05;letter-spacing:-.01em}
  .end p b{display:block;font-weight:300;font-size:42px;text-shadow:0 0 12px rgba(255,255,255,.65),0 0 2px #fff}
  .end button{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:9px 20px;font:400 14px var(--font);cursor:pointer}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

  const line = el("path",{fill:"none",stroke:"#2a2a2a","stroke-width":1.4});
  const bands = FREQS.map((f,i) => {
    const g = el("g",{class:"band",tabindex:0,role:"slider","aria-label":HZ[i],"aria-valuemin":-10,"aria-valuemax":10});
    const c = el("circle",{class:"knob",r:5.5,cx:bx(i),cy:Y0},g);
    const tipBg = el("rect",{x:bx(i)-20,y:0,width:40,height:18,rx:9,fill:"#111",opacity:0},g);
    const tip = el("text",{x:bx(i),y:0,class:"tip",opacity:0},g);
    g.addEventListener("keydown", e => {
      const step = e.shiftKey ? 2 : 0.5;
      if (e.key==="ArrowUp"||e.key==="ArrowRight") { setBand(i, gains[i]+step); e.preventDefault(); }
      if (e.key==="ArrowDown"||e.key==="ArrowLeft") { setBand(i, gains[i]-step); e.preventDefault(); }
      if (e.key==="Home") { setBand(i, 0); e.preventDefault(); }
    });
    g.addEventListener("focus", ()=>showTip(i,true)); g.addEventListener("blur", ()=>showTip(i,false));
    return {g,c,tip,tipBg};
  });
  function showTip(i,on){ const b=bands[i]; b.g.classList.toggle("active",on); b.tip.setAttribute("opacity",on?1:0); b.tipBg.setAttribute("opacity",on?1:0); }

  function smoothPath(pts){
    let d=`M${pts[0][0]},${pts[0][1]}`;
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2, t=6;
      d+=` C${p1[0]+(p2[0]-p0[0])/t},${p1[1]+(p2[1]-p0[1])/t} ${p2[0]-(p3[0]-p1[0])/t},${p2[1]-(p3[1]-p1[1])/t} ${p2[0]},${p2[1]}`;
    }
    return d;
  }
  const fmt = g => (g>0?"+":"")+(Math.round(g*10)/10).toFixed(1)+" dB";
  function drawCurve(){
    const pts = gains.map((g,i)=>[bx(i), gy(g)]);
    const d = smoothPath(pts);
    line.setAttribute("d", d);
    area.setAttribute("d", `${d} L${bx(5)},${YB} L${bx(0)},${YB} Z`);
    bands.forEach((b,i)=>{
      const y=gy(gains[i]);
      b.c.setAttribute("cy", y);
      const ty = y < YT+26 ? y+26 : y-14;
      b.tip.setAttribute("y", ty+4); b.tipBg.setAttribute("y", ty-9);
      b.tip.textContent = fmt(gains[i]);
      b.g.setAttribute("aria-valuenow", gains[i]); b.g.setAttribute("aria-valuetext", fmt(gains[i]));
    });
  }

  function setBand(i, g, fromUser=true){
    gains[i] = Math.round(Math.max(-10,Math.min(10,g))*2)/2;
    if (fromUser && !active.startsWith("slot")) active = "custom";
    applyGains(); drawCurve(); syncUI(); persist();
  }
  let persistT; function persist(){ clearTimeout(persistT); persistT=setTimeout(()=>{ store.set("eq.gains",gains); store.set("eq.active",active); },250); }

  let animRaf;
  function animateTo(target){
    cancelAnimationFrame(animRaf);
    const from=gains.slice(), t0=performance.now(), dur=matchMedia("(prefers-reduced-motion: reduce)").matches?1:320;
    const step = now => {
      const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
      gains = from.map((f,i)=>f+(target[i]-f)*e);
      drawCurve(); applyGains();
      if(k<1) animRaf=requestAnimationFrame(step); else { gains=target.slice(); drawCurve(); applyGains(); syncUI(); persist(); }
    };
    syncUI(); animRaf=requestAnimationFrame(step);
  }

  // pointer dragging
  let dragBand=-1;
  function svgPoint(e){ const r=svg.getBoundingClientRect(); return [ (e.clientX-r.left)*360/r.width, (e.clientY-r.top)*210/r.height ]; }
  svg.addEventListener("pointerdown", e => {
    const [x,y]=svgPoint(e);
    let best=0, bd=1e9; FREQS.forEach((f,i)=>{ const d=Math.abs(bx(i)-x); if(d<bd){bd=d;best=i;} });
    if (bd>30) return;
    dragBand=best; svg.setPointerCapture(e.pointerId); showTip(best,true);
    setBand(best, yg(y)); e.preventDefault();
  });
  svg.addEventListener("pointermove", e => { if(dragBand<0) return; setBand(dragBand, yg(svgPoint(e)[1])); });
  const endDrag = () => { if(dragBand>=0){ showTip(dragBand,false); dragBand=-1; } };
  svg.addEventListener("pointerup", endDrag); svg.addEventListener("pointercancel", endDrag);

  $("reset").addEventListener("click", () => { active="flat"; animateTo(PRESETS[5].g); toast("Reset to flat"); });

  function syncUI(){
    presetsEl.querySelectorAll(".tile").forEach(b=>b.setAttribute("aria-pressed", b.dataset.id===active));
    slotsEl.querySelectorAll(".slot").forEach((b,i)=>{ b.setAttribute("aria-pressed", b.dataset.id===active); b.classList.toggle("empty", !slots[i]); b.title = slots[i] ? `Tap to load ${SLOT_NAMES[i]}, hold to overwrite` : `Tap to save the current curve to ${SLOT_NAMES[i]}`; });
    const p = PRESETS.find(p=>p.id===active);
    $("readout").textContent = p ? p.name : active.startsWith("slot") ? SLOT_NAMES[+active.slice(4)] : "Custom curve";
  }

  /* ---------- audio engine ---------- */
  let ctx, filters, pre, master, analyser, dryG, wideG, revG, demoBus, noiseBuf, mediaSrc;
  const audio = new Audio(); audio.loop = true; audio.preload = "auto";
  let mode = "demo", playing = false;

  function initAudio(){
    if (ctx) return;
    ctx = new (window.AudioContext||window.webkitAudioContext)();
    pre = ctx.createGain();
    filters = FREQS.map((f,i)=>{ const b=ctx.createBiquadFilter(); b.type = i===0?"lowshelf":i===5?"highshelf":"peaking"; b.frequency.value=f; b.Q.value=1.1; return b; });
    pre.connect(filters[0]); for(let i=0;i<5;i++) filters[i].connect(filters[i+1]);
    const eqOut = filters[5];
    master = ctx.createGain();
    // dry
    dryG = ctx.createGain(); eqOut.connect(dryG); dryG.connect(master);
    // immersive: mid/side widening + decorrelated room
    const split=ctx.createChannelSplitter(2), merge=ctx.createChannelMerger(2), k=1.9;
    const a=(1+k)/2, b=(1-k)/2;
    const LL=ctx.createGain(), RL=ctx.createGain(), RR=ctx.createGain(), LR=ctx.createGain();
    LL.gain.value=a; RR.gain.value=a; RL.gain.value=b; LR.gain.value=b;
    eqOut.connect(split);
    split.connect(LL,0); split.connect(LR,0); split.connect(RR,1); split.connect(RL,1);
    LL.connect(merge,0,0); RL.connect(merge,0,0); RR.connect(merge,0,1); LR.connect(merge,0,1);
    wideG = ctx.createGain(); merge.connect(wideG); wideG.connect(master);
    const conv = ctx.createConvolver(); conv.buffer = roomImpulse(1.6); revG = ctx.createGain();
    eqOut.connect(conv); conv.connect(revG); revG.connect(master);
    // safety limiter + analyser
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-4; comp.knee.value=6; comp.ratio.value=14; comp.attack.value=.003; comp.release.value=.2;
    analyser = ctx.createAnalyser(); analyser.fftSize=4096; analyser.smoothingTimeConstant=.82;
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
    // sources
    demoBus = ctx.createGain(); demoBus.gain.value=0; demoBus.connect(pre);
    mediaSrc = ctx.createMediaElementSource(audio); mediaSrc.connect(pre);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const nd=noiseBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    applyGains(true); applyImmersive(true);
  }
  function roomImpulse(sec){
    const n=Math.floor(ctx.sampleRate*sec), buf=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=buf.getChannelData(c); for(let i=0;i<n;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)*(i<ctx.sampleRate*.012?0:1); } }
    return buf;
  }
  function applyGains(now){
    if (!ctx) return;
    const t=ctx.currentTime, tc = now?0.001:0.03;
    filters.forEach((f,i)=>f.gain.setTargetAtTime(gains[i], t, tc));
    const peak = Math.max(0,...gains);
    pre.gain.setTargetAtTime(Math.pow(10, -peak*0.55/20), t, 0.05);
  }
  function applyImmersive(now){
    if (!ctx) return;
    const on=$("immersive").checked, t=ctx.currentTime, tc=now?0.001:0.08;
    dryG.gain.setTargetAtTime(on?0:1, t, tc);
    wideG.gain.setTargetAtTime(on?0.82:0, t, tc);
    revG.gain.setTargetAtTime(on?0.2:0, t, tc);
  }
  $("immersive").addEventListener("change", () => { applyImmersive(); toast($("immersive").checked ? "Immersive Audio on" : "Immersive Audio off"); });

  /* ---------- demo track (generated live) ---------- */
  const BPM=96, S16=60/BPM/4, LOOP=64;
  const CH=[ {bass:55, pad:[220,261.63,329.63]}, {bass:43.65, pad:[174.61,220,261.63]}, {bass:65.41, pad:[196,261.63,329.63]}, {bass:49, pad:[196,246.94,293.66]} ];
  let stepN=0, nextT=0, schedTimer=null, loopStart=0;
  function env(g,t,a,peak,dec){ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec); }
  function kick(t){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(42,t+.12); env(g,t,.003,.95,.38); o.connect(g).connect(demoBus); o.start(t); o.stop(t+.45); }
  function noise(t,type,freq,peak,dec,pan){ const s=ctx.createBufferSource(); s.buffer=noiseBuf; const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=type==="bandpass"?.9:.7; const g=ctx.createGain(); env(g,t,.002,peak,dec); const p=ctx.createStereoPanner(); p.pan.value=pan; s.connect(f).connect(g).connect(p).connect(demoBus); s.start(t, Math.random()*.5); s.stop(t+dec+.05); }
  function bass(t,f,len){ const o=ctx.createOscillator(), o2=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain(); o.type="sawtooth"; o2.type="sine"; o.frequency.value=f; o2.frequency.value=f/2; lp.type="lowpass"; lp.frequency.setValueAtTime(900,t); lp.frequency.exponentialRampToValueAtTime(180,t+len); env(g,t,.01,.32,len); o.connect(lp); o2.connect(lp); lp.connect(g).connect(demoBus); o.start(t); o2.start(t); o.stop(t+len+.05); o2.stop(t+len+.05); }
  function pad(t,notes,len){ notes.forEach((f,j)=>{ [-7,7].forEach((det,m)=>{ const o=ctx.createOscillator(), lp=ctx.createBiquadFilter(), g=ctx.createGain(), p=ctx.createStereoPanner(); o.type="sawtooth"; o.frequency.value=f; o.detune.value=det; lp.type="lowpass"; lp.frequency.value=1600; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.035,t+.35); g.gain.setValueAtTime(.035,t+len-.3); g.gain.exponentialRampToValueAtTime(0.0001,t+len); p.pan.value=(m?1:-1)*(.35+j*.15); o.connect(lp).connect(g).connect(p).connect(demoBus); o.start(t); o.stop(t+len+.05); }); }); }
  function pluck(t,f,pan){ const o=ctx.createOscillator(), g=ctx.createGain(), p=ctx.createStereoPanner(), hp=ctx.createBiquadFilter(); o.type="square"; o.frequency.value=f; hp.type="highpass"; hp.frequency.value=500; env(g,t,.004,.06,.22); p.pan.value=pan; o.connect(hp).connect(g).connect(p).connect(demoBus); o.start(t); o.stop(t+.3); }
  function scheduleStep(n,t){
    const s=n%16, bar=Math.floor(n/16)%4, c=CH[bar];
    if (s===0) pad(t,c.pad,S16*16);
    if (s===0||s===8||(bar===3&&s===10)) kick(t);
    if (s===4||s===12) { noise(t,"bandpass",1900,.45,.16,0); noise(t,"highpass",5000,.12,.1,0); }
    if (s%2===0) noise(t,"highpass",9000,s%4===2?.16:.09,s%4===2?.09:.03, .3);
    if (s===14) noise(t,"highpass",8000,.1,.22,-.3);
    if (s%2===0) bass(t, (s===6||s===14)? c.bass*2 : c.bass, S16*1.8);
    if (s%3===0) pluck(t, c.pad[(s/3)%3]*2, s%2? .5 : -.5);
  }
  function scheduler(){ while(nextT < ctx.currentTime+.12){ if(stepN%LOOP===0) loopStart=nextT; scheduleStep(stepN,nextT); nextT+=S16; stepN++; } }
  function startDemo(){ demoBus.gain.cancelScheduledValues(ctx.currentTime); demoBus.gain.setTargetAtTime(.8,ctx.currentTime,.02); stepN=0; nextT=ctx.currentTime+.05; scheduler(); schedTimer=setInterval(scheduler,25); }
  function stopDemo(){ clearInterval(schedTimer); schedTimer=null; if(demoBus) demoBus.gain.setTargetAtTime(0,ctx.currentTime,.03); }

  /* ---------- transport ---------- */
  const ICON_PLAY='<svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>', ICON_PAUSE='<svg viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>';
  function setPlaying(on){ playing=on; $("play").innerHTML = on?ICON_PAUSE:ICON_PLAY; $("play").setAttribute("aria-label", on?"Pause":"Play"); if(on) loop(); }
  $("play").innerHTML = ICON_PLAY;
  async function play(){
    initAudio(); if (ctx.state!=="running") await ctx.resume();
    if (mode==="demo") startDemo();
    else { try { await audio.play(); } catch(e){ toast("This file can't be played here"); return; } }
    setPlaying(true);
    if (mode==="demo") $("trackSub").textContent = "Built-in test track · 96 BPM";
  }
  function pause(){ if(mode==="demo") stopDemo(); else audio.pause(); setPlaying(false); }
  $("play").addEventListener("click", () => playing ? pause() : play());
  $("file").addEventListener("change", e => {
    const f = e.target.files && e.target.files[0]; if(!f) return;
    if (playing) pause();
    if (audio.src) URL.revokeObjectURL(audio.src);
    audio.src = URL.createObjectURL(f); mode="file";
    $("trackTitle").textContent = f.name.replace(/\.[^.]+$/,"");
    $("trackSub").textContent = "Your song";
    play();
  });
  const mmss = s => isFinite(s) ? `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}` : "0:00";

  /* ---------- live spectrum behind the curve ---------- */
  const cv=$("spec"), cx2=cv.getContext("2d"); let fbuf;
  function sizeCanvas(){ const r=svg.getBoundingClientRect(), d=Math.min(2,devicePixelRatio||1); cv.width=r.width*d; cv.height=r.height*d; cv.style.height=r.height+"px"; }
  addEventListener("resize", sizeCanvas);
  let loopRaf;
  function loop(){
    cancelAnimationFrame(loopRaf);
    const frame = () => {
      if (mode==="demo" && ctx) { const k=((ctx.currentTime-loopStart)/(S16*LOOP))%1; $("prog").style.width=(Math.max(0,k)*100)+"%"; }
      else if (audio.duration) { $("prog").style.width=(audio.currentTime/audio.duration*100)+"%"; $("trackSub").textContent=`Your song · ${mmss(audio.currentTime)} / ${mmss(audio.duration)}`; }
      drawSpectrum();
      if (playing) loopRaf=requestAnimationFrame(frame); else { cx2.clearRect(0,0,cv.width,cv.height); }
    };
    loopRaf=requestAnimationFrame(frame);
  }
  function drawSpectrum(){
    if(!analyser) return;
    if(!fbuf) fbuf=new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(fbuf);
    const W=cv.width, H=cv.height, sx=W/360, sy=H/210; cx2.clearRect(0,0,W,H);
    const lo=Math.log10(40), hi=Math.log10(20000), N=56, nyq=ctx.sampleRate/2;
    const xOf = f => (X0-14 + (Math.log10(f)-lo)/(hi-lo)*(X1-X0+28))*sx;
    cx2.fillStyle="rgba(0,0,0,.07)";
    for(let i=0;i<N;i++){
      const f0=Math.pow(10,lo+(hi-lo)*i/N), f1=Math.pow(10,lo+(hi-lo)*(i+1)/N);
      const b0=Math.floor(f0/nyq*fbuf.length), b1=Math.max(b0+1,Math.floor(f1/nyq*fbuf.length));
      let m=0; for(let b=b0;b<b1&&b<fbuf.length;b++) m=Math.max(m,fbuf[b]);
      const h=(m/255)*(YB-YT)*sy, x=xOf(f0), w=Math.max(1,xOf(f1)-x-1.5*sx);
      cx2.fillRect(x, YB*sy-h, w, h);
    }
  }

  /* ---------- splash / exit ---------- */
  function hideSplash(){ $("splash").classList.add("gone"); setTimeout(()=>{ $("splash").hidden=true; sizeCanvas(); }, 520); }
  setTimeout(hideSplash, matchMedia("(prefers-reduced-motion: reduce)").matches ? 300 : 1300);
  $("exit").addEventListener("click", () => { if(playing) pause(); $("end").hidden=false; });
  $("reopen").addEventListener("click", () => { $("end").hidden=true; const s=$("splash"); s.hidden=false; s.classList.remove("gone"); setTimeout(hideSplash, 900); });

  drawCurve(); syncUI(); sizeCanvas();
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
